<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - KSOP Utama Makassar</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="auth-body">
    <div class="auth-card">
        <div style="text-align: center; margin-bottom: 12px;">
            <img src="{{ url_for('static', filename='LOGO_KEMENTERIAN_PERHUBUNGAN-removebg-preview.png') }}" alt="Logo Kementerian" style="width: clamp(38px, 10vw, 52px); height: clamp(38px, 10vw, 52px); object-fit: contain;">
        </div>
        <h2>Portal Kehadiran Magang</h2>
        <p>KSOP Utama Makassar - Kementerian Perhubungan</p>

        {% if error %}
        <script>
            Swal.fire({
                icon: 'error',
                title: 'Login Gagal',
                text: {{ error|tojson }},
                confirmButtonColor: '#0b2545'
            });
        </script>
        {% endif %}

        <form action="/login" method="POST" id="formLogin">
            <div class="form-group-luxury">
                <label>Username</label>
                <input type="text" name="username" required autocomplete="off" placeholder="Masukkan username...">
            </div>
            <div class="form-group-luxury">
                <label>Password <span style="font-weight: 400; color: #64748b;">(minimal 6 karakter)</span></label>
                <input type="password" name="password" id="loginPassword" required minlength="6"
                       title="Password minimal 6 karakter" placeholder="Masukkan password...">
            </div>
            <button type="submit" class="btn-submit-luxury" style="margin-top: 10px;">Masuk Sistem</button>
            <p style="text-align:right; margin-top:8px; font-size:12px;">
                <a href="/lupa-password" style="color:#0096c7; font-weight:700; text-decoration:none;">Lupa password?</a>
            </p>
        </form>

        <p style="text-align:center; margin-top:20px; font-size:13px; color:#64748b;">Belum terdaftar? <a href="/register" style="color:#0096c7; font-weight:700; text-decoration:none;">Daftar Akun Baru (Magang)</a></p>
    </div>

    <script>
        // Validasi password minimal 6 karakter dengan pop-up
        document.getElementById('formLogin').addEventListener('submit', function (e) {
            const pw = document.getElementById('loginPassword').value.trim();
            if (pw.length < 6) {
                e.preventDefault();
                Swal.fire({
                    icon: 'warning',
                    title: 'Password Terlalu Pendek',
                    text: 'Password minimal 6 karakter.',
                    confirmButtonColor: '#0b2545'
                });
            }
        });
    </script>
</body>
</html>
