<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lupa Password - KSOP Utama Makassar</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="auth-body">
    <div class="auth-card">
        <div style="text-align: center; margin-bottom: 12px;">
            <img src="{{ url_for('static', filename='LOGO_KEMENTERIAN_PERHUBUNGAN-removebg-preview.png') }}" alt="Logo Kementerian" style="width: clamp(38px, 10vw, 52px); height: clamp(38px, 10vw, 52px); object-fit: contain;">
        </div>
        <h2>Lupa Password</h2>
        <p>Masukkan username terdaftar dan password baru Anda.</p>

        {% if error %}
        <script>
            Swal.fire({
                icon: 'error',
                title: 'Gagal',
                text: {{ error|tojson }},
                confirmButtonColor: '#0b2545'
            });
        </script>
        {% endif %}

        {% if success %}
        <script>
            Swal.fire({
                icon: 'success',
                title: 'Berhasil',
                text: {{ success|tojson }},
                confirmButtonColor: '#0b2545'
            }).then(() => { window.location.href = '/login'; });
        </script>
        {% endif %}

        <form method="POST">
            <div class="form-group-luxury">
                <label>Username</label>
                <input type="text" name="username" required autocomplete="off" placeholder="Masukkan username..." value="{{ username or '' }}">
            </div>
            <div class="form-group-luxury">
                <label>Password Baru</label>
                <input type="password" name="password" required minlength="6" placeholder="Minimal 6 karakter">
            </div>
            <div class="form-group-luxury">
                <label>Ulangi Password Baru</label>
                <input type="password" name="password2" required minlength="6" placeholder="Ketik ulang password">
            </div>
            <button type="submit" class="btn-submit-luxury" style="margin-top: 10px;">Simpan Password Baru</button>
        </form>

        <p style="text-align:center; margin-top:20px; font-size:13px;">
            <a href="/login" style="color:#0096c7; font-weight:700; text-decoration:none;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: -2px; margin-right: 5px;" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>Kembali ke Login</a>
        </p>
    </div>
</body>
</html>
