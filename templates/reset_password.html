<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - KSOP Utama Makassar</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-body">
    <div class="auth-card">
        <div style="text-align: center; margin-bottom: 12px;">
            <img src="{{ url_for('static', filename='LOGO_KEMENTERIAN_PERHUBUNGAN-removebg-preview.png') }}" alt="Logo Kementerian" style="width: clamp(38px, 10vw, 52px); height: clamp(38px, 10vw, 52px); object-fit: contain;">
        </div>

        {% if invalid %}
            <h2>Link Tidak Valid</h2>
            <p>Link sudah kedaluwarsa atau sudah pernah dipakai.</p>
            <a href="/lupa-password" class="btn-submit-luxury" style="display:block; text-align:center; text-decoration:none; margin-top:10px;">Minta Link Baru</a>
        {% else %}
            <h2>Buat Password Baru</h2>
            <p>Masukkan password baru untuk akun Anda.</p>
            {% if error %}
                <div style="color:#c62828; background:#ffebee; font-size:13px; font-weight:600; padding:10px 12px; border-radius:8px; margin-bottom:12px;">{{ error }}</div>
            {% endif %}
            <form method="POST">
                <div class="form-group-luxury">
                    <label>Password Baru</label>
                    <input type="password" name="password" required minlength="6" placeholder="Minimal 6 karakter">
                </div>
                <div class="form-group-luxury">
                    <label>Ulangi Password Baru</label>
                    <input type="password" name="password2" required minlength="6" placeholder="Ketik ulang password">
                </div>
                <button type="submit" class="btn-submit-luxury" style="margin-top: 10px;">Simpan Password</button>
            </form>
        {% endif %}
    </div>
</body>
</html>
